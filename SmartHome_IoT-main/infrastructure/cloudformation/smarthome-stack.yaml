AWSTemplateFormatVersion: '2010-09-09'
Description: SmartHome IoT - DynamoDB, EC2, Cognito, CloudWatch (ap-southeast-2)

Parameters:
  ProjectName:
    Type: String
    Default: smarthome
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 SSH key pair name
  AllowedSSHIp:
    Type: String
    Default: 0.0.0.0/0
    Description: IP CIDR allowed for SSH (use your IP/32 in production)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC ID (auto-filled by deploy script)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in default VPC (auto-filled by deploy script)

Resources:
  # ---------- DynamoDB ----------
  SmartHomeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SmartHome
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ---------- CloudWatch Logs ----------
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /smarthome/audit
      RetentionInDays: 30

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /smarthome/app
      RetentionInDays: 14

  CognitoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /smarthome/cognito
      RetentionInDays: 30

  LoginFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AuditLogGroup
      FilterPattern: '{ $.event = "LOGIN_FAILED" }'
      MetricTransformations:
        - MetricName: LoginFailed
          MetricNamespace: SmartHome
          MetricValue: '1'

  LoginFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-login-failed'
      AlarmDescription: Alert when failed login attempts spike
      MetricName: LoginFailed
      Namespace: SmartHome
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SmartHomeDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Failed Logins (5 min)",
                "metrics": [["SmartHome", "LoginFailed"]],
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300
              }
            },
            {
              "type": "log",
              "x": 0, "y": 6, "width": 24, "height": 6,
              "properties": {
                "title": "Audit Log",
                "query": "SOURCE '/smarthome/audit' | fields @timestamp, event, username, ip | sort @timestamp desc | limit 50",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 12, "width": 24, "height": 6,
              "properties": {
                "title": "App Log",
                "query": "SOURCE '/smarthome/app' | fields @timestamp, @message | sort @timestamp desc | limit 50",
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  # ---------- Cognito ----------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: []
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]

  CognitoAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref CognitoUserPool
      Description: Administrators
      Precedence: 1

  CognitoUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref CognitoUserPool
      Description: Regular users
      Precedence: 10

  CognitoAdminUser:
    Type: AWS::Cognito::UserPoolUser
    DependsOn: CognitoUserPool
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: admin
      MessageAction: SUPPRESS
      UserAttributes:
        - Name: name
          Value: SmartHome Admin

  CognitoAdminGroupAttach:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DependsOn: CognitoAdminUser
    Properties:
      GroupName: admin
      Username: admin
      UserPoolId: !Ref CognitoUserPool

  # Set admin password: infrastructure/scripts/init-cognito-admin.sh

  # ---------- EC2 IAM ----------
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SmartHomeBackendPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt SmartHomeTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/smarthome/*'
              - Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:InitiateAuth
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !GetAtt CognitoUserPool.Arn
              - Effect: Allow
                Action:
                  - iot:Connect
                  - iot:Publish
                  - iot:Subscribe
                  - iot:Receive
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref EC2Role]

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SmartHome backend + frontend
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHIp
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref EC2SecurityGroup]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf update -y
          dnf install -y nodejs npm nginx git
          npm install -g pm2
          mkdir -p /opt/smarthome/dist
          mkdir -p /opt/smarthome/backend
          cat > /etc/systemd/system/smarthome.service << 'UNIT'
          [Unit]
          Description=SmartHome backend
          After=network.target
          [Service]
          Type=simple
          WorkingDirectory=/opt/smarthome/backend
          ExecStart=/usr/bin/node server.js
          Restart=always
          Environment=NODE_ENV=production
          Environment=USE_LOCAL_DB=false
          Environment=DYNAMODB_TABLE=SmartHome
          Environment=AWS_REGION=ap-southeast-2
          Environment=COGNITO_ENABLED=true
          Environment=COGNITO_USER_POOL_ID=${CognitoUserPool}
          Environment=COGNITO_CLIENT_ID=${CognitoUserPoolClient}
          Environment=CLOUDWATCH_ENABLED=true
          Environment=CLOUDWATCH_LOG_GROUP=/smarthome/audit
          Environment=CLOUDWATCH_APP_LOG_GROUP=/smarthome/app
          Environment=MQTT_ENABLED=true
          Environment=ALLOW_PUBLIC_REGISTER=false
          Environment=SIMULATE_DOOR=false
          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable nginx
          systemctl start nginx
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-backend'

Outputs:
  DynamoDBTable:
    Value: !Ref SmartHomeTable
  EC2PublicIP:
    Value: !GetAtt EC2Instance.PublicIp
  EC2InstanceId:
    Value: !Ref EC2Instance
  WebURL:
    Description: Frontend + API (nginx on EC2)
    Value: !Sub 'http://${EC2Instance.PublicIp}'
  ApiURL:
    Description: Set VITE_API_URL when building frontend (same as WebURL)
    Value: !Sub 'http://${EC2Instance.PublicIp}'
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  AuditLogGroup:
    Value: !Ref AuditLogGroup
  AppLogGroup:
    Value: !Ref AppLogGroup
  CloudWatchDashboard:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProjectName}-dashboard'
  AdminUsername:
    Value: admin
