version: 1
frontend:
  phases:
    preBuild:
      commands:
        - export HUGO_VERSION=0.164.0
        - curl -Lo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        - tar -xzf hugo.tar.gz hugo
        - chmod +x hugo
        - sudo mv hugo /usr/local/bin/hugo
        - hugo version
        - git submodule update --init --recursive
    build:
      commands:
        - |
          if [ -n "$AMPLIFY_DOMAIN" ]; then
            export HUGO_BASEURL="${AMPLIFY_DOMAIN%/}/"
          else
            export HUGO_BASEURL="https://${AWS_BRANCH}.${AWS_APP_ID}.amplifyapp.com/"
          fi
          echo "Building Hugo with baseURL=${HUGO_BASEURL}"
          hugo --minify --gc --baseURL "${HUGO_BASEURL}"
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths:
      - .git/modules/**/*

customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
  - pattern: "**/*.html"
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: "**/*.{css,js,jpg,jpeg,png,gif,svg,woff,woff2,ico}"
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable

customRedirects:
  - source: "/404"
    target: "/404.html"
    status: "404-200"
