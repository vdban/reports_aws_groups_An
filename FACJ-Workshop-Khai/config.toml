baseURL = "/"
relativeURLs = false
canonifyURLs = true
defaultContentLanguage = "en"

# Amplify build overrides baseURL via amplify.yml:
#   hugo --minify --baseURL "https://<branch>.<app-id>.amplifyapp.com/"
# Or set AMPLIFY_DOMAIN in Amplify Console (custom domain).
#
# Local dev:
#   hugo server -D
#   http://localhost:1313/  (EN)  |  http://localhost:1313/vi/  (VI)

theme = "hugo-theme-learn"

# Ảnh đặt trong content/images/ → serve tại /images/...
[module]
[[module.mounts]]
source = "content"
target = "content"
excludeFiles = ["images/**"]
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "content/images"
target = "static/images"

[outputs]
home = [ "HTML", "RSS", "JSON"]

[params]
  themeVariant = "workshop"
  editURL = ""
  description = ""
  author = "thienlh@thienlu.com"
  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false

[Languages]
[Languages.en]
title = "Internship Report"
weight = 1
languageName = "English"

[[Languages.en.menu.shortcuts]]
name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
identifier = "AWS Study Group"
url = "https://awsstudygroup.com"
weight = 20

[[Languages.en.menu.shortcuts]]
name = "<i class='fab fa-facebook'></i> AWS Study Group - FB Group"
identifier = "AWS Study Group FB"
url = "https://www.facebook.com/groups/awsstudygroupfcj"
weight = 20

[Languages.vi]
title = "Báo cáo thực tập"
weight = 2
languageName = "Tiếng Việt"

[[Languages.vi.menu.shortcuts]]
name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
identifier = "AWS Study Group"
url = "http://awsstudygroup.com"
weight = 20

[[Languages.vi.menu.shortcuts]]
name = "<i class='fab fa-facebook'></i> AWS Study Group - Nhóm FB"
identifier = "AWS Study Group FB"
url = "https://www.facebook.com/groups/awsstudygroupfcj"
weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
