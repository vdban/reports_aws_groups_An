<div class="searchbox">
    <label for="search-by"><i class="fas fa-search"></i></label>
    <input data-search-input id="search-by" type="search" placeholder="{{T "Search-placeholder"}}">
    <span data-search-clear=""><i class="fas fa-times"></i></span>
</div>
{{ $assetBusting := not .Site.Params.disableAssetsBusting }}
<script type="text/javascript" src="{{ "js/lunr.min.js" | absURL }}{{ if $assetBusting }}?{{ now.Unix }}{{ end }}"></script>
<script type="text/javascript" src="{{ "js/auto-complete.js" | absURL }}{{ if $assetBusting }}?{{ now.Unix }}{{ end }}"></script>
<script type="text/javascript">
    {{ if hugo.IsMultilingual }}
        var baseurl = "{{ urls.JoinPath .Site.BaseURL .Site.LanguagePrefix }}";
    {{ else }}
        var baseurl = "{{ .Site.BaseURL }}";
    {{ end }}
</script>
<script type="text/javascript" src="{{ "js/search.js" | absURL }}{{ if $assetBusting }}?{{ now.Unix }}{{ end }}"></script>
